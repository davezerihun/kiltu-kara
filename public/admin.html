<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiltu Kara Secondary School - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-export {
            background-color: #28a745;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-export:hover {
            background-color: #218838;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 1200px;">
        <div class="top-bar">
            <h2>Student Registration Dashboard</h2>
            <button id="exportCsvBtn" class="btn-export">📥 Export to CSV</button>
        </div>

        <a href="index.html">&larr; Registration Form</a>

        <div class="filters" style="margin-top: 15px; margin-bottom: 15px;">
            <label>Search:</label>
            <input type="text" id="searchInput" placeholder="Search by name or reference...">

            <label>Grade:</label>
            <select id="filterGrade">
                <option value="ALL">All Grades</option>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>

            <label>Stream:</label>
            <select id="filterStream">
                <option value="ALL">All Streams</option>
                <option value="General">General</option>
                <option value="Natural Science">Natural Science</option>
                <option value="Social Science">Social Science</option>
            </select>

            <label>Payment Status:</label>
            <select id="filterPayment">
                <option value="ALL">All Payments</option>
                <option value="Completed">Completed</option>
                <option value="Pending">Pending</option>
                <option value="Waived">Waived</option>
            </select>
        </div>

        <h3>Showing <span id="studentCount">0</span> student record(s)</h3>

        <table border="1" cellpadding="8" cellspacing="0" style="width:100%; text-align:left; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #e9e3d5;">
                    <th>#</th>
                    <th>FULL NAME</th>
                    <th>AGE</th>
                    <th>GENDER</th>
                    <th>GRADE</th>
                    <th>STREAM</th>
                    <th>AVERAGE</th>
                    <th>ACADEMIC STATUS</th>
                    <th>PAYMENT STATUS</th>
                    <th>REFERENCE CODE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody">
                <!-- Records load dynamically -->
            </tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
