<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiltu Kara Secondary School - Registration Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-wrapper">
    <!-- HERO LANDING BANNER -->
    <header class="hero-section">
      <div class="hero-overlay">
        <h1 class="school-title">KILTU KARA SECONDARY SCHOOL</h1>
        <p class="hero-subtitle">Excellence in Education & Future Leadership</p>
        <span class="badge-portal">Official Student Registration Portal</span>
      </div>
    </header>

    <!-- REGISTRATION FORM CARD -->
    <main class="form-card">
      <div class="header-container">
        <h2>STUDENT REGISTRATION FORM</h2>
        <p>Fields marked <span style="color:#ef4444">*</span> are required</p>
      </div>

      <form id="registrationForm">

        <!-- Full Name — REQUIRED -->
        <div class="input-group">
          <label for="fullName">Full Name <span style="color:#ef4444">*</span></label>
          <input type="text" id="fullName" placeholder="e.g. Dawit Zarihun" required>
        </div>

        <!-- National ID & Receipt No — optional -->
        <div class="form-row">
          <div class="input-group">
            <label for="nationalId">National / Student ID</label>
            <input type="text" id="nationalId" placeholder="e.g. 7106316487932437">
          </div>
          <div class="input-group">
            <label for="receiptNo">Receipt No.</label>
            <input type="text" id="receiptNo" placeholder="e.g. REC-2026-001">
          </div>
        </div>

        <!-- Age & Gender — Gender REQUIRED -->
        <div class="form-row">
          <div class="input-group">
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Age" min="10" max="30">
          </div>
          <div class="input-group">
            <label for="gender">Gender <span style="color:#ef4444">*</span></label>
            <select id="gender" required>
              <option value="" disabled selected>Select Gender</option>
              <option value="M">M</option>
              <option value="F">F</option>
            </select>
          </div>
        </div>

        <!-- Grade — REQUIRED & Stream — optional -->
        <div class="form-row">
          <div class="input-group">
            <label for="grade">Grade <span style="color:#ef4444">*</span></label>
            <select id="grade" required>
              <option value="" disabled selected>Select Grade</option>
              <option value="Grade 9">Grade 9</option>
              <option value="Grade 10">Grade 10</option>
              <option value="Grade 11">Grade 11</option>
              <option value="Grade 12">Grade 12</option>
            </select>
          </div>
          <div class="input-group">
            <label for="stream">Academic Stream</label>
            <select id="stream">
              <option value="">— Select Stream —</option>
              <option value="General">General</option>
              <option value="NS">Natural Science (NS)</option>
              <option value="SS">Social Science (SS)</option>
            </select>
          </div>
        </div>

        <!-- Section & Average — both optional -->
        <div class="form-row">
          <div class="input-group">
            <label for="section">Section</label>
            <select id="section">
              <option value="">— Select Section —</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
            </select>
          </div>
          <div class="input-group">
            <label for="average">Academic Average (%)</label>
            <input type="number" id="average" placeholder="e.g. 85" min="0" max="100">
          </div>
        </div>

        <!-- Previous School — optional -->
        <div class="form-row">
          <div class="input-group">
            <label for="previousSchool">Previous School</label>
            <input type="text" id="previousSchool" placeholder="Previous school name">
          </div>
        </div>

        <!-- Woreda & Kebele — optional -->
        <div class="form-row">
          <div class="input-group">
            <label for="woreda">Woreda</label>
            <input type="text" id="woreda" placeholder="e.g. Kiltu Kara">
          </div>
          <div class="input-group">
            <label for="kebele">Kebele</label>
            <input type="text" id="kebele" placeholder="e.g. 01">
          </div>
        </div>

        <!-- Guardian Information — optional -->
        <div class="form-row">
          <div class="input-group">
            <label for="guardianName">Guardian Name</label>
            <input type="text" id="guardianName" placeholder="Guardian Full Name">
          </div>
          <div class="input-group">
            <label for="guardianPhone">Guardian Phone</label>
            <input type="tel" id="guardianPhone" placeholder="09xxxxxxxx">
          </div>
        </div>

        <button type="submit" class="btn-submit">Submit Registration</button>
      </form>

      <div class="nav-footer">
        <a href="/admin.html">Go to Admin Dashboard →</a>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        fullName:        document.getElementById('fullName').value,
        nationalId:      document.getElementById('nationalId').value,
        receiptNo:       document.getElementById('receiptNo').value,
        age:             document.getElementById('age').value,
        gender:          document.getElementById('gender').value,
        grade:           document.getElementById('grade').value,
        stream:          document.getElementById('stream').value,
        section:         document.getElementById('section').value,
        average:         document.getElementById('average').value,
        academicAverage: document.getElementById('average').value,
        previousSchool:  document.getElementById('previousSchool').value,
        woreda:          document.getElementById('woreda').value,
        kebele:          document.getElementById('kebele').value,
        guardianName:    document.getElementById('guardianName').value,
        guardianPhone:   document.getElementById('guardianPhone').value
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          alert('Student registered successfully!');
          document.getElementById('registrationForm').reset();
        } else {
          alert('Error: ' + (data.error || 'Registration failed.'));
        }
      } catch (err) {
        alert('Server connection failed. Please try again.');
      }
    });
  </script>
</body>
</html>
