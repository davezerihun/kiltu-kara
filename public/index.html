<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiltu Kara Secondary School - Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Student Registration Form</h2>
        <form id="registrationForm">
            
            <!-- Personal Details -->
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter age" min="10" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- Grade Level -->
            <div class="form-group">
                <label for="grade">Grade Level:</label>
                <select id="grade" name="grade" required>
                    <option value="">Select Grade</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
            </div>

            <!-- Dynamic Academic Stream Field -->
            <div class="form-group">
                <label for="stream">Academic Stream:</label>
                <select id="stream" name="stream" required>
                    <option value="">Select Grade First</option>
                </select>
            </div>

            <!-- Academic Performance Fields -->
            <div class="form-group">
                <label for="average">Academic Average (%):</label>
                <input type="number" id="average" name="average" step="0.1" min="0" max="100" placeholder="e.g. 68.5" required>
            </div>

            <div class="form-group">
                <label for="failedSubjects">Number of Failed Subjects:</label>
                <input type="number" id="failedSubjects" name="failedSubjects" min="0" value="0" required>
            </div>

            <!-- Payment Information -->
            <div class="form-group">
                <label for="paymentStatus">Payment Status:</label>
                <select id="paymentStatus" name="paymentStatus">
                    <option value="Completed" selected>Completed (Testing Default)</option>
                    <option value="Pending">Pending</option>
                    <option value="Waived">Waived</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentReference">Transaction / Receipt Ref (Optional):</label>
                <input type="text" id="paymentReference" name="paymentReference" placeholder="e.g. TXN-123456">
            </div>

            <button type="submit">Register Student</button>
        </form>

        <div id="responseMessage"></div>
    </div>

    <!-- External Script Handlers -->
    <script src="script.js"></script>
</body>
</html>
