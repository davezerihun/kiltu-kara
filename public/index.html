<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiltu Kara Secondary School - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Student Registration Form</h2>
  <form id="registrationForm">
    <input type="text" id="fullName" placeholder="Full Name" required>
    <input type="text" id="nationalId" placeholder="National ID / Student ID" required>
    <input type="number" id="age" placeholder="Age" required>

    <select id="gender" required>
      <option value="" disabled selected>Select Gender</option>
      <option value="M">M</option>
      <option value="F">F</option>
    </select>

    <select id="grade" required>
      <option value="" disabled selected>Select Grade</option>
      <option value="Grade 9">Grade 9</option>
      <option value="Grade 10">Grade 10</option>
      <option value="Grade 11">Grade 11</option>
      <option value="Grade 12">Grade 12</option>
    </select>

    <select id="stream" required>
      <option value="" disabled selected>Select Academic Stream</option>
      <option value="General">General</option>
      <option value="NS">NS</option>
      <option value="SS">SS</option>
    </select>

    <input type="number" id="average" placeholder="Academic Average (%)" min="0" max="100" required>
    <input type="text" id="previousSchool" placeholder="Previous School" required>
    <input type="text" id="guardianName" placeholder="Guardian Name" required>
    <input type="tel" id="guardianPhone" placeholder="Guardian Phone Number" required>

    <button type="submit">Submit Registration</button>
  </form>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: document.getElementById('fullName').value,
        nationalId: document.getElementById('nationalId').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        grade: document.getElementById('grade').value,
        stream: document.getElementById('stream').value,
        average: document.getElementById('average').value,
        previousSchool: document.getElementById('previousSchool').value,
        guardianName: document.getElementById('guardianName').value,
        guardianPhone: document.getElementById('guardianPhone').value
      };

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Student registered successfully!');
        document.getElementById('registrationForm').reset();
      } else {
        alert('Error submitting registration.');
      }
    });
  </script>
</body>
</html>
