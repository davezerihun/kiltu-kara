<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiltu Kara Secondary School - Online Registration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { background: #1e293b; width: 100%; max-width: 800px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; text-align: center; margin-bottom: 8px; font-size: 1.6rem; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .input-group { display: flex; flex-direction: column; }
    .input-group.full-width { grid-column: span 2; }
    label { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    input, select { padding: 10px; border: 1px solid #334155; border-radius: 6px; font-size: 0.9rem; background: #0f172a; color: #fff; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 1rem; margin-top: 20px; cursor: pointer; }
    .btn-submit:hover { background: #1d4ed8; }
    .nav-link { display: inline-block; margin-top: 15px; color: #38bdf8; text-decoration: none; font-size: 0.85rem; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .input-group.full-width { grid-column: span 1; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Standard Student Registration</h1>
    <p class="subtitle">Fill out all required details to register online</p>

    <form id="onlineRegForm">
      <div class="form-grid">
        <div class="input-group">
          <label>Full Name *</label>
          <input type="text" id="fullName" required>
        </div>
        <div class="input-group">
          <label>National / Student ID</label>
          <input type="text" id="nationalId">
        </div>
        <div class="input-group">
          <label>Age *</label>
          <input type="number" id="age" required min="10" max="30">
        </div>
        <div class="input-group">
          <label>Sex *</label>
          <select id="sex" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="input-group">
          <label>Grade Level *</label>
          <select id="grade" required>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
        </div>
        <div class="input-group">
          <label>Academic Stream</label>
          <select id="stream">
            <option value="Natural Science (NS)">Natural Science (NS)</option>
            <option value="Social Science (SS)">Social Science (SS)</option>
          </select>
        </div>
        <div class="input-group">
          <label>Academic Average (%)</label>
          <input type="number" id="average" min="0" max="100">
        </div>
        <div class="input-group">
          <label>Previous School</label>
          <input type="text" id="previousSchool">
        </div>
        <div class="input-group">
          <label>Woreda *</label>
          <input type="text" id="woreda" required>
        </div>
        <div class="input-group">
          <label>Kebele</label>
          <input type="text" id="kebele">
        </div>
        <div class="input-group">
          <label>Guardian Name *</label>
          <input type="text" id="guardianName" required>
        </div>
        <div class="input-group">
          <label>Guardian Phone *</label>
          <input type="tel" id="guardianPhone" required>
        </div>
      </div>
      <button type="submit" class="btn-submit">Submit Registration</button>
    </form>
    <a href="/off_reg.html" class="nav-link">Go to Official Census Form →</a>
  </div>

  <script>
    document.getElementById('onlineRegForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        fullName: document.getElementById('fullName').value,
        nationalId: document.getElementById('nationalId').value,
        age: Number(document.getElementById('age').value),
        sex: document.getElementById('sex').value,
        grade: document.getElementById('grade').value,
        stream: document.getElementById('stream').value,
        average: Number(document.getElementById('average').value) || 0,
        previousSchool: document.getElementById('previousSchool').value,
        woreda: document.getElementById('woreda').value,
        kebele: document.getElementById('kebele').value,
        guardianName: document.getElementById('guardianName').value,
        guardianPhone: document.getElementById('guardianPhone').value
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.success) {
          alert('Registration submitted successfully!');
          document.getElementById('onlineRegForm').reset();
        } else {
          alert('Error: ' + (data.error || 'Failed to submit registration.'));
        }
      } catch (err) {
        alert('Server error: ' + err.message);
      }
    });
  </script>
</body>
</html>
