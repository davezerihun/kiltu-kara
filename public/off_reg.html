<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiltu Kara Secondary School - Official Registration Form 2019</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 20px; display: flex; justify-content: center; }

    /* PAPER TEMPLATE CARD */
    .paper-container {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    /* HEADER & PHOTO SECTION */
    .form-header-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #059669;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .header-text { flex: 1; padding-right: 20px; }
    .header-text h1 { font-size: 1.3rem; color: #065f46; font-weight: 700; text-transform: uppercase; line-height: 1.3; }
    .header-text p { font-size: 0.85rem; color: #475569; margin-top: 5px; }

    /* PHOTO UPLOAD BOX */
    .photo-box-container {
      width: 110px;
      height: 130px;
      border: 2px dashed #94a3b8;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      text-align: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .photo-box-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .photo-box-container span { font-size: 0.75rem; color: #64748b; font-weight: 600; padding: 4px; }
    .photo-box-container input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    /* SECTIONS */
    .section-title {
      background-color: #059669;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 4px;
      margin: 18px 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* FORM GRID */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .input-group { display: flex; flex-direction: column; }
    .input-group.full-width { grid-column: span 3; }
    .input-group.span-2 { grid-column: span 2; }

    label { font-size: 0.75rem; font-weight: 600; color: #334155; margin-bottom: 4px; }
    input, select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.82rem;
      outline: none;
      background: #fafafa;
    }
    input:focus, select:focus { border-color: #059669; background: #ffffff; box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15); }

    /* BUTTONS */
    .btn-submit {
      width: 100%;
      background: #059669;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 25px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #047857; }

    .nav-link { display: inline-block; margin-top: 15px; color: #059669; text-decoration: none; font-size: 0.85rem; font-weight: 600; }

    /* A4 SINGLE PAGE PRINT STYLES */
    @media print {
      body { background: white; padding: 0; }
      .paper-container { border: none; box-shadow: none; width: 100%; max-width: 100%; padding: 0; }
      .btn-submit, .nav-link, input[type="file"] { display: none !important; }
      .photo-box-container { border: 1px solid #000; }
      input, select { border: none; border-bottom: 1px solid #000; background: transparent; padding: 2px 0; border-radius: 0; }
      @page { size: A4 portrait; margin: 12mm; }
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .input-group.span-2, .input-group.full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <div class="paper-container">
    
    <!-- HEADER WITH PHOTO BOX -->
    <div class="form-header-grid">
      <div class="header-text">
        <h1>Kiltu Kara Secondary School Student Registration Form 2019</h1>
        <p>Official School Census & Student Data Registration Form</p>
      </div>

      <!-- PHOTO PLACEHOLDER BOX -->
      <div class="photo-box-container">
        <img id="photoPreview" alt="Student Photo">
        <span id="photoPlaceholder">Photo<br><small>(Click to upload)</small></span>
        <input type="file" id="studentPhoto" accept="image/*" onchange="previewImage(event)">
      </div>
    </div>

    <form id="officialForm">

      <!-- 1. STUDENT BASIC DATA TEMPLATE -->
      <div class="section-title">1. Student Basic Data Template</div>
      <div class="form-grid">
        <div class="input-group">
          <label>Has A Student ID? *</label>
          <select id="hasStudentId" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>
        <div class="input-group span-2">
          <label>Student ID</label>
          <input type="text" id="studentId" placeholder="Enter ID if existing">
        </div>

        <div class="input-group">
          <label>First Name *</label>
          <input type="text" id="firstName" required>
        </div>
        <div class="input-group">
          <label>Father's Name *</label>
          <input type="text" id="fathersName" required>
        </div>
        <div class="input-group">
          <label>Grandfather's Name *</label>
          <input type="text" id="grandfathersName" required>
        </div>

        <div class="input-group">
          <label>Admission Type *</label>
          <input type="text" id="admissionType" placeholder="e.g. Regular / Extension" required>
        </div>
        <div class="input-group">
          <label>Sex *</label>
          <select id="sex" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="input-group">
          <label>Date Of Birth *</label>
          <input type="date" id="dateOfBirth" required>
        </div>

        <div class="input-group">
          <label>Disability *</label>
          <select id="disability" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>
        <div class="input-group span-2">
          <label>Disability Type</label>
          <input type="text" id="disabilityType" placeholder="Specify if applicable">
        </div>

        <div class="input-group">
          <label>Country Of Birth</label>
          <input type="text" id="countryOfBirth" value="Ethiopia">
        </div>
        <div class="input-group">
          <label>Region Of Birth</label>
          <input type="text" id="regionOfBirth">
        </div>
        <div class="input-group">
          <label>Zone Of Birth</label>
          <input type="text" id="zoneOfBirth">
        </div>

        <div class="input-group">
          <label>Woreda Of Birth</label>
          <input type="text" id="woredaOfBirth">
        </div>
        <div class="input-group">
          <label>Nationality *</label>
          <input type="text" id="nationality" value="Ethiopian" required>
        </div>
        <div class="input-group">
          <label>Region *</label>
          <input type="text" id="region" required>
        </div>

        <div class="input-group">
          <label>Zone *</label>
          <input type="text" id="zone" required>
        </div>
        <div class="input-group">
          <label>Woreda *</label>
          <input type="text" id="woreda" required>
        </div>
        <div class="input-group">
          <label>Kebele</label>
          <input type="text" id="kebele">
        </div>

        <div class="input-group">
          <label>Location Type *</label>
          <select id="locationType" required>
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
          </select>
        </div>
        <div class="input-group">
          <label>Student Economic Status</label>
          <input type="text" id="studentEconomicStatus">
        </div>
        <div class="input-group">
          <label>Parent Status *</label>
          <input type="text" id="parentStatus" placeholder="e.g. Both Alive" required>
        </div>

        <div class="input-group span-2">
          <label>Father's Or Male Guardian's Education Level *</label>
          <input type="text" id="fatherEducationLevel" required>
        </div>
        <div class="input-group">
          <label>Mother's Or Female Guardian's Education Level *</label>
          <input type="text" id="motherEducationLevel" required>
        </div>

        <div class="input-group span-2">
          <label>Parent's Or Guardian's Full Name</label>
          <input type="text" id="parentGuardianFullName">
        </div>
        <div class="input-group">
          <label>Parent's Or Guardian's Email</label>
          <input type="email" id="parentGuardianEmail">
        </div>

        <div class="input-group">
          <label>Parent's Or Guardian's Phone</label>
          <input type="tel" id="parentGuardianPhone">
        </div>
        <div class="input-group">
          <label>Family Head's Gender *</label>
          <select id="familyHeadGender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="input-group">
          <label>National ID</label>
          <input type="text" id="nationalId">
        </div>
      </div>

      <!-- 2. STUDENTS ENROLLMENT TEMPLATE -->
      <div class="section-title">2. Students Enrollment Template</div>
      <div class="form-grid">
        <div class="input-group">
          <label>Admission Category *</label>
          <input type="text" id="admissionCategory" required>
        </div>
        <div class="input-group">
          <label>Admission Modality *</label>
          <input type="text" id="admissionModality" required>
        </div>
        <div class="input-group">
          <label>Grade Level *</label>
          <select id="gradeLevel" required>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
        </div>

        <div class="input-group">
          <label>Section *</label>
          <input type="text" id="section" placeholder="e.g. A" required>
        </div>
        <div class="input-group span-2">
          <label>Education Stream</label>
          <input type="text" id="educationStream" placeholder="e.g. Natural Science / Social Science">
        </div>

        <div class="input-group">
          <label>Career And Technical Education 1st Field</label>
          <input type="text" id="careerTechnical1stField">
        </div>
        <div class="input-group span-2">
          <label>Career And Technical Education 2nd Field</label>
          <input type="text" id="careerTechnical2ndField">
        </div>

        <div class="input-group">
          <label>Number Of Text Books</label>
          <input type="number" id="numberOfTextbooks" min="0">
        </div>
        <div class="input-group span-2">
          <label>Main Instructional Language</label>
          <input type="text" id="mainInstructionalLanguage" value="English">
        </div>

        <div class="input-group">
          <label>Participation In School Feeding</label>
          <select id="schoolFeedingParticipation">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>
        <div class="input-group">
          <label>Food Ration Home Taking *</label>
          <select id="foodRationHomeTaking" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>
        <div class="input-group">
          <label>Number Of Meals Per Week *</label>
          <input type="number" id="numberOfMealsPerWeek" min="0" required>
        </div>

        <div class="input-group full-width">
          <label>Average Marks (%)</label>
          <input type="number" id="average" min="0" max="100" placeholder="e.g. 82">
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Official Registration</button>
    </form>

    <a href="/" class="nav-link">← Back to Main Registration Hub</a>
  </div>

  <script>
    let photoBase64 = '';

    // IMAGE PREVIEW FUNCTION
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          photoBase64 = e.target.result;
          document.getElementById('photoPreview').src = photoBase64;
          document.getElementById('photoPreview').style.display = 'block';
          document.getElementById('photoPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }

    // FORM SUBMISSION
    document.getElementById('officialForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        photo: photoBase64,
        hasStudentId: document.getElementById('hasStudentId').value,
        studentId: document.getElementById('studentId').value,
        firstName: document.getElementById('firstName').value,
        fathersName: document.getElementById('fathersName').value,
        grandfathersName: document.getElementById('grandfathersName').value,
        admissionType: document.getElementById('admissionType').value,
        sex: document.getElementById('sex').value,
        disability: document.getElementById('disability').value,
        disabilityType: document.getElementById('disabilityType').value,
        dateOfBirth: document.getElementById('dateOfBirth').value,
        countryOfBirth: document.getElementById('countryOfBirth').value,
        regionOfBirth: document.getElementById('regionOfBirth').value,
        zoneOfBirth: document.getElementById('zoneOfBirth').value,
        woredaOfBirth: document.getElementById('woredaOfBirth').value,
        nationality: document.getElementById('nationality').value,
        region: document.getElementById('region').value,
        zone: document.getElementById('zone').value,
        woreda: document.getElementById('woreda').value,
        kebele: document.getElementById('kebele').value,
        locationType: document.getElementById('locationType').value,
        studentEconomicStatus: document.getElementById('studentEconomicStatus').value,
        parentStatus: document.getElementById('parentStatus').value,
        fatherEducationLevel: document.getElementById('fatherEducationLevel').value,
        motherEducationLevel: document.getElementById('motherEducationLevel').value,
        parentGuardianFullName: document.getElementById('parentGuardianFullName').value,
        parentGuardianEmail: document.getElementById('parentGuardianEmail').value,
        parentGuardianPhone: document.getElementById('parentGuardianPhone').value,
        familyHeadGender: document.getElementById('familyHeadGender').value,
        nationalId: document.getElementById('nationalId').value,
        admissionCategory: document.getElementById('admissionCategory').value,
        admissionModality: document.getElementById('admissionModality').value,
        gradeLevel: document.getElementById('gradeLevel').value,
        section: document.getElementById('section').value,
        educationStream: document.getElementById('educationStream').value,
        careerTechnical1stField: document.getElementById('careerTechnical1stField').value,
        careerTechnical2ndField: document.getElementById('careerTechnical2ndField').value,
        numberOfTextbooks: document.getElementById('numberOfTextbooks').value,
        mainInstructionalLanguage: document.getElementById('mainInstructionalLanguage').value,
        schoolFeedingParticipation: document.getElementById('schoolFeedingParticipation').value,
        foodRationHomeTaking: document.getElementById('foodRationHomeTaking').value,
        numberOfMealsPerWeek: document.getElementById('numberOfMealsPerWeek').value,
        average: document.getElementById('average').value
      };

      try {
        const res = await fetch('/api/official-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Official registration submitted successfully!');
          document.getElementById('officialForm').reset();
          document.getElementById('photoPreview').style.display = 'none';
          document.getElementById('photoPlaceholder').style.display = 'block';
          photoBase64 = '';
        } else {
          alert('Failed to submit registration.');
        }
      } catch (err) {
        alert('Server connection error.');
      }
    });
  </script>
</body>
</html>
